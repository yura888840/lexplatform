name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (PHP 8.4)
    env:
      APP_ENV: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lex
          POSTGRES_PASSWORD: lex_secret
          POSTGRES_DB: lexplatform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lex"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, pdo_sqlite, amqp, redis, zip, sodium
          coverage: none
      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Validate dependency lock
        working-directory: backend
        run: composer validate --strict
      - name: Migrate test database
        working-directory: backend
        run: php bin/console doctrine:migrations:migrate --no-interaction
      - name: Boot container
        working-directory: backend
        run: php bin/console lint:container
      - name: Lint
        working-directory: backend
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPStan
        working-directory: backend
        run: vendor/bin/phpstan analyse src --level=6 --no-progress --memory-limit=1G
      - name: PHPUnit
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://lex:lex_secret@127.0.0.1:5432/lexplatform_test?serverVersion=16"
        run: vendor/bin/phpunit

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f docker/php-prod/Dockerfile -t lexplatform-backend:ci .
          docker build -f docker/node-prod/Dockerfile -t lexplatform-frontend:ci .

  release-images:
    name: Push K8s images (on tag)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        run: |
          docker build -f docker/php-prod/Dockerfile -t ghcr.io/${{ github.repository_owner }}/backend:${{ github.ref_name }} .
          docker push ghcr.io/${{ github.repository_owner }}/backend:${{ github.ref_name }}
      - name: Build & push frontend
        run: |
          docker build -f docker/node-prod/Dockerfile -t ghcr.io/${{ github.repository_owner }}/frontend:${{ github.ref_name }} .
          docker push ghcr.io/${{ github.repository_owner }}/frontend:${{ github.ref_name }}
