apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lexplatform.fullname" . }}-worker
  labels: {{- include "lexplatform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # graceful shutdown: воркер дорабатывает сообщение до SIGKILL
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # --time-limit: воркер перезапускается сам, освобождая память (anti-leak)
          command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M"]
          env: {{- include "lexplatform.backendEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
