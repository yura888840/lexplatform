apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lexplatform.fullname" . }}-backend
  labels: {{- include "lexplatform.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # PHP-FPM (Symfony, код запечён в образ на CI)
        - name: php-fpm
          image: "{{ .Values.image.registry }}/{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env: {{- include "lexplatform.backendEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          # JWT-ключи генерируются в init-хуке образа либо монтируются секретом (см. docs)
          readinessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: public-shared
              mountPath: /shared
          lifecycle:
            postStart:
              exec:
                # nginx sidecar нужен public/ (index.php + статика) из образа PHP
                command: ["sh", "-c", "cp -r /var/www/backend/public/. /shared/"]
        # Nginx sidecar: HTTP → fastcgi на localhost:9000
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: public-shared
              mountPath: /var/www/backend/public
              readOnly: true
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "lexplatform.fullname" . }}-nginx
        - name: public-shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lexplatform.fullname" . }}-backend
  labels: {{- include "lexplatform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
