version: "3.9"

# LexPlatform — Dev / MVP environment (ТЗ §13.1)
# make init && make up  →  http://localhost:3000 (frontend), http://localhost:8080/api (API)

services:
  # ── Symfony 7 / PHP 8.4 ────────────────────────────────────────────────
  app:
    build:
      context: ./docker/php
    container_name: lex_app
    working_dir: /var/www/backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lex}:${POSTGRES_PASSWORD:-lex_secret}@postgres:5432/${POSTGRES_DB:-lexplatform}?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_USER:-lex}:${RABBITMQ_PASSWORD:-lex_secret}@rabbitmq:5672/%2f/messages"
      OPENSEARCH_URL: "http://opensearch:9200"
      S3_ENDPOINT: "http://minio:9000"
      S3_KEY: ${MINIO_ROOT_USER:-lexminio}
      S3_SECRET: ${MINIO_ROOT_PASSWORD:-lexminio_secret}
      S3_BUCKET: ${S3_BUCKET:-lex-media}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      MAILER_DSN: "${MAILER_DSN:-smtp://mailhog:1025}"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-lexplatform}
      LIQPAY_PUBLIC_KEY: ${LIQPAY_PUBLIC_KEY:-sandbox_public_key}
      LIQPAY_PRIVATE_KEY: ${LIQPAY_PRIVATE_KEY:-sandbox_private_key}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      opensearch:
        condition: service_started

  # Async worker (Symfony Messenger — нотификации, индексация)
  worker:
    build:
      context: ./docker/php
    container_name: lex_worker
    working_dir: /var/www/backend
    command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lex}:${POSTGRES_PASSWORD:-lex_secret}@postgres:5432/${POSTGRES_DB:-lexplatform}?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_USER:-lex}:${RABBITMQ_PASSWORD:-lex_secret}@rabbitmq:5672/%2f/messages"
      OPENSEARCH_URL: "http://opensearch:9200"
      MAILER_DSN: "${MAILER_DSN:-smtp://mailhog:1025}"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-lexplatform}
      LIQPAY_PUBLIC_KEY: ${LIQPAY_PUBLIC_KEY:-sandbox_public_key}
      LIQPAY_PRIVATE_KEY: ${LIQPAY_PRIVATE_KEY:-sandbox_private_key}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      - app
    restart: unless-stopped

  # ── Nginx ──────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lex_nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      - app

  # ── Next.js frontend ───────────────────────────────────────────────────
  node:
    build:
      context: ./docker/node
    container_name: lex_frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
      API_INTERNAL_URL: "http://nginx/api/v1"

  # ── Data layer ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lex_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lex_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lexplatform}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lex_redis
    volumes:
      - redis_data:/data

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: lex_opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - os_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lex_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lex}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lex_secret}
    ports:
      - "15672:15672"   # management UI

  minio:
    image: minio/minio:latest
    container_name: lex_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lexminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lexminio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ── Dev tooling ────────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: lex_mailhog
    ports:
      - "8025:8025"

  adminer:
    image: adminer:latest
    container_name: lex_adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  pg_data:
  redis_data:
  os_data:
  minio_data:
